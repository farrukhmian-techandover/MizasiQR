<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deen – Prayer Times & Quran</title>
<script>
  (function () {
    var ios = "https://apps.apple.com/gb/app/deen-prayer-times-quran/id6738344292";
    var android = "https://play.google.com/store/apps/details?id=islamic.ai.app";
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIOS) window.location.replace(ios);
    else if (isAndroid) {
      // Opens the app if installed; Chrome falls back to the Play Store if not
      window.location.replace(
        "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;" +
        "package=islamic.ai.app;S.browser_fallback_url=" + encodeURIComponent(android) + ";end"
      );
    }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f6f7f5;color:#1d2a24;text-align:center;padding:16px}
  a{display:block;margin:12px auto;padding:14px 20px;max-width:260px;border-radius:12px;background:#1f6f4a;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div>
    <h1>Get the Deen app</h1>
    <a href="https://apps.apple.com/gb/app/deen-prayer-times-quran/id6738344292">Download on the App Store</a>
    <a href="https://play.google.com/store/apps/details?id=islamic.ai.app">Get it on Google Play</a>
  </div>
</body>
</html>
